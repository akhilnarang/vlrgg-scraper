[project]
name = "app"
version = "0.1.0"
description = "A FastAPI backend that serves data scraped from vlr.gg"
requires-python = ">=3.14"
authors = [
    { name = "Akhil Narang", email = "me@akhilnarang.dev" }
]
dependencies = [
    "fastapi[all]>=0.121.0,<0.142",
    "httpx2[http2]",
    "PyJWT[crypto]",
    "beautifulsoup4",
    "uvicorn[standard]",
    "gunicorn",
    "uvicorn-worker",
    "python-dateutil",
    "firebase-admin",
    "sentry-sdk[arq,fastapi,starlette]",
    "lxml",
    "redis[hiredis]",
    "arq",
    "rich",
    "openai",
    "sqlalchemy>=2,<3",
    "aiosqlite",
    "alembic",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-regressions",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff]
line-length = 120
exclude = ["__init__.py"]

[tool.pytest.ini_options]
pythonpath = "."
# --strict-markers: an unregistered or typo'd marker must be a hard error, never a
# silent zero-match pass that leaves a scheduled job green while testing nothing.
addopts = "--strict-markers"
markers = [
    "live_golden: snapshot tests for frozen entities, fetched live from VLR",
    "live_health: structural-health checks for windowed VLR endpoints",
]
